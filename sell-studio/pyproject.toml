[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sell-studio"
version = "0.1.0"
description = "중고 판매 스튜디오: 사진 → 판매글 초안·상세페이지·개인정보 점검·되팔이 장부"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
sell-studio = "sellstudio.cli:main"

[tool.setuptools.packages.find]
include = ["sellstudio", "sellstudio.*"]
