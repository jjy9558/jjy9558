<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{--bg:#f6f7f9;--fg:#1c1f24;--mut:#667085;--card:#fff;--line:#e2e5ea;--acc:#3b6df0;--accfg:#fff}
:root[data-theme=dark]{--bg:#12141a;--fg:#e8eaf0;--mut:#98a2b3;--card:#1c1f27;--line:#2b303b;--acc:#7b9cff;--accfg:#10131a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12141a;--fg:#e8eaf0;--mut:#98a2b3;--card:#1c1f27;--line:#2b303b;--acc:#7b9cff;--accfg:#10131a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"Malgun Gothic","Noto Sans KR",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
h1{font-size:18px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=search],button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;max-width:100%}
input[type=search]{flex:1 1 140px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border-radius:999px;padding:2px 10px;font-size:13px;cursor:pointer}
.chip.on,button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
main{padding:8px 16px 40px;max-width:1200px;margin:0 auto}
h2{font-size:15px;color:var(--mut);margin:22px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
figure img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;cursor:zoom-in;background:var(--line)}
figcaption{padding:8px;font-size:13px;overflow-wrap:anywhere}
.game{font-weight:600}.meta{color:var(--mut);font-size:12px}
.star{color:#e0a100}
.tag{display:inline-block;color:var(--acc);font-size:12px;margin-right:6px}
#empty{color:var(--mut);padding:30px 0;text-align:center}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;padding:12px}
#lb.open{display:flex}
#lb img{max-width:100%;max-height:75vh;object-fit:contain}
#lbcap{color:#fff;margin-top:10px;max-width:800px;text-align:center;overflow-wrap:anywhere}
#lb .nav{margin-top:10px;display:flex;gap:8px}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,1fr);gap:8px}main,header{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<header>
<h1><span>{{TITLE}} <span class="meta">({{COUNT}}장)</span></span><button id="theme" type="button">테마</button></h1>
<div class="ctl">
<select id="game" aria-label="게임"></select>
<input id="q" type="search" placeholder="캡션·태그 검색" aria-label="검색">
<button id="nb" type="button">★ 주요 장면만</button>
</div>
<div class="chips" id="tags"></div>
</header>
<main><div id="tl"></div><div id="empty" hidden>표시할 스크린샷이 없습니다.</div></main>
<div id="lb" role="dialog" aria-modal="true"><img alt=""><div id="lbcap"></div>
<div class="nav"><button id="prev" type="button">이전</button><button id="next" type="button">다음</button><button id="close" type="button">닫기</button></div></div>
<noscript>JavaScript 가 필요합니다.</noscript>
<script id="data" type="application/json">{{DATA}}</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
var $=function(i){return document.getElementById(i)};
var st={game:'',tag:'',q:'',nb:false},view=[],cur=0;
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function theme(v){document.documentElement.setAttribute('data-theme',v);try{localStorage.setItem('gd-theme',v)}catch(e){}}
try{var t=localStorage.getItem('gd-theme');if(t)theme(t)}catch(e){}
$('theme').onclick=function(){var d=document.documentElement.getAttribute('data-theme');
 if(!d)d=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';theme(d==='dark'?'light':'dark')};
var games=[],cnt={};D.forEach(function(d){cnt[d.game]=(cnt[d.game]||0)+1});
games=Object.keys(cnt).sort();
var gs=$('game');gs.appendChild(new Option('모든 게임 ('+D.length+')',''));
games.forEach(function(g){gs.appendChild(new Option(g+' ('+cnt[g]+')',g))});
gs.onchange=function(){st.game=gs.value;render()};
$('q').oninput=function(){st.q=this.value.toLowerCase();render()};
$('nb').onclick=function(){st.nb=!st.nb;this.classList.toggle('on',st.nb);render()};
var tc={};D.forEach(function(d){(d.tags||[]).forEach(function(t){tc[t]=(tc[t]||0)+1})});
Object.keys(tc).sort(function(a,b){return tc[b]-tc[a]}).slice(0,30).forEach(function(t){
 var b=el('button','chip','#'+t);b.type='button';b.onclick=function(){st.tag=st.tag===t?'':t;
 Array.prototype.forEach.call($('tags').children,function(c){c.classList.toggle('on',c.textContent==='#'+st.tag)});render()};
 $('tags').appendChild(b)});
function match(d){
 if(st.game&&d.game!==st.game)return false;
 if(st.nb&&!d.notable)return false;
 if(st.tag&&(d.tags||[]).indexOf(st.tag)<0)return false;
 if(st.q){var h=(d.caption+' '+d.game+' '+(d.tags||[]).join(' ')+' '+d.mood).toLowerCase();if(h.indexOf(st.q)<0)return false}
 return true}
function render(){
 view=D.filter(match).sort(function(a,b){return a.ts<b.ts?1:a.ts>b.ts?-1:0});
 var tl=$('tl');tl.textContent='';$('empty').hidden=view.length>0;
 var day='',grid=null;
 view.forEach(function(d,i){
  var dd=d.ts.slice(0,10);
  if(dd!==day){day=dd;tl.appendChild(el('h2',null,dd));grid=el('div','grid');tl.appendChild(grid)}
  var f=el('figure'),im=el('img');im.loading='lazy';im.src=d.thumb||d.src;im.alt=d.caption||d.game;
  im.onclick=function(){open(i)};f.appendChild(im);
  var c=el('figcaption');
  var g=el('div','game',d.game);if(d.notable){g.appendChild(el('span','star',' ★'))}c.appendChild(g);
  c.appendChild(el('div',null,d.caption||'(캡션 없음)'));
  c.appendChild(el('div','meta',d.ts.slice(11,16)+(d.mood?' · '+d.mood:'')));
  (d.tags||[]).forEach(function(t){c.appendChild(el('span','tag','#'+t))});
  f.appendChild(c);grid.appendChild(f)})}
function open(i){cur=i;var d=view[i];$('lb').classList.add('open');$('lb').querySelector('img').src=d.src;
 $('lbcap').textContent=d.game+' · '+d.ts+' — '+(d.caption||'')}
function step(n){if(!view.length)return;cur=(cur+n+view.length)%view.length;open(cur)}
function close(){$('lb').classList.remove('open')}
$('prev').onclick=function(){step(-1)};$('next').onclick=function(){step(1)};$('close').onclick=close;
$('lb').onclick=function(e){if(e.target===this)close()};
document.addEventListener('keydown',function(e){if(!$('lb').classList.contains('open'))return;
 if(e.key==='Escape')close();else if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1)});
render();
})();
</script>
</body>
</html>
