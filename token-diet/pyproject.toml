[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "token-diet"
version = "0.1.0"
description = "토큰 다이어트: 세션 로그 절감 포인트, MCP 체중계, 반복 프롬프트, CLAUDE.md 린터"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
token-diet = "tokendiet.cli:main"

[tool.setuptools.packages.find]
include = ["tokendiet", "tokendiet.*"]
