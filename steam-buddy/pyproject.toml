[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-buddy"
version = "0.1.0"
description = "스팀 구매 결정 비서: 사기 전 체크, 환불 기한 추적, 구매 후 돌아보기"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
steam-buddy = "steam_buddy.cli:main"

[tool.setuptools]
packages = ["steam_buddy"]
